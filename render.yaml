services:
  - type: web
    name: thechasix-api
    region: oregon
    plan: free
    env: python
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: cache
      mountPath: /opt/render/project/src/data/cache
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SCHWAB_CLIENT_ID
        sync: false
      - key: SCHWAB_CLIENT_SECRET
        sync: false
      - key: SCHWAB_REFRESH_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO_MONTHLY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.thechasix.com
