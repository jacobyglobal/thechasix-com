<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}The ChasIX{% endblock %}</title>
  <meta name="description" content="{% block description %}Financial intelligence: ETF market highs, sector breadth, and market data.{% endblock %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="/">The<span class="accent">ChasIX</span></a>
      <ul class="nav-links">
        <li><a href="/screener.html">Screener</a></li>
        <li class="nav-drop">
          <button type="button" class="nav-drop-btn" aria-haspopup="true" aria-expanded="false">Stocks <span class="caret">▾</span></button>
          <ul class="nav-drop-menu">
            <li><a href="/watchlist.html">Stock Watchlist</a></li>
            <li><a href="/news.html">News</a></li>
          </ul>
        </li>
        <li><a href="/stock.html?ticker=SPY">ETF Detail</a></li>
        <li><a href="/calculator.html">Trading Edge</a></li>
        <li><a href="/pricing.html">Pricing</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 The ChasIX. Market data for research &amp; education — not investment advice.</p>
    </div>
  </footer>

  <script>
    window.API_ROOT = "{{ api_root }}";
  </script>
  <script src="/js/main.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
