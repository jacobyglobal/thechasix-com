[build]
  publish = "dist"
  command = "echo 'Pre-built locally, skipping Netlify build step.'"

[[redirects]]
  from = "/api/*"
  to = "https://api.thechasix.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/webhook/stripe"
  to = "https://api.thechasix.com/webhook/stripe"
  status = 200
  force = true

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "20"
  API_ROOT = "https://api.thechasix.com"
  STRIPE_PUBLISHABLE_KEY = "pk_test_placeholder"
